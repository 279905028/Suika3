# 当前目标：106.14.32.114；先安装到独立版本目录，复核后切换 current。
server {
    listen 80;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/galagame.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/galagame.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SuikaTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_name 106.14.32.114 galagame.site;
    root /srv/suika3/current/web;
    index index.html;
    autoindex off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    etag on;
    gzip_static on;
    gzip_vary on;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        application/wasm wasm;
        application/octet-stream arc;
        image/webp webp;
        video/mp4 mp4;
    }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/suika3-access.log;
    error_log /var/log/nginx/suika3-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/suika3-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    # URL 含分发指纹；历史版本保留，缓存期间不覆盖其内容。
    location ^~ /r/cc1ba27c1351074a/ {
        alias /srv/suika3/releases/20261105-perf-cc1ba27c1351074a/web/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        deny all;
    }
}
